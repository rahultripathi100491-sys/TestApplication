name: Build and Deploy .NET API to Somee

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy API
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Check .NET version
        run: dotnet --version

      # Restore packages from inside TestApplication.API
      - name: Restore dependencies
        run: dotnet restore TestApplication.API/TestApplication.API.csproj

      # Build project
      - name: Build solution
        run: dotnet build TestApplication.API/TestApplication.API.csproj -c Release --no-restore

      # Publish project
      - name: Publish API
        run: dotnet publish TestApplication.API/TestApplication.API.csproj -c Release -o ./publish --no-restore

      - name: Check published files
        shell: powershell
        run: |
          Write-Host "Published files:"
          Get-ChildItem -Path ./publish -Recurse

      # Deploy via FTP
      - name: Deploy to Somee
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_PATH }}

      - name: Deployment completed
        run: |
          echo "======================================"
          echo "Deployment completed successfully!"
          echo "======================================"
