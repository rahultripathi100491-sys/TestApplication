name: Build and Deploy .NET API to Somee

# ==========================================
# WHEN TO RUN
# ==========================================

on:
  push:
    branches:
      - main

  # Allows manual execution from GitHub Actions
  workflow_dispatch:


# ==========================================
# JOB
# ==========================================

jobs:

  build-and-deploy:

    name: Build and Deploy API

    runs-on: windows-latest


    steps:

      # ======================================
      # 1. Checkout source code
      # ======================================

      - name: Checkout source code
        uses: actions/checkout@v6


      # ======================================
      # 2. Setup .NET
      # ======================================

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'


      # ======================================
      # 3. Display .NET version
      # ======================================

      - name: Check .NET version
        run: dotnet --version


      # ======================================
      # 4. Restore NuGet packages
      # ======================================

      - name: Restore dependencies
        run: dotnet restore


      # ======================================
      # 5. Build solution
      # ======================================

      - name: Build solution
        run: dotnet build -c Release --no-restore


      # ======================================
      # 6. Publish API
      # ======================================

      - name: Publish API
        run: dotnet publish ./TestApplication.API/TestApplication.API.csproj -c Release -o ./publish --no-restore


      # ======================================
      # 7. Show published files
      # ======================================

      - name: Check published files
        shell: powershell
        run: |
          Write-Host "Published files:"
          Get-ChildItem -Path ./publish -Recurse


      # ======================================
      # 8. Deploy to Somee using FTP
      # ======================================

      - name: Deploy to Somee
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_PATH }}


      # ======================================
      # 9. Deployment completed
      # ======================================

      - name: Deployment completed
        run: |
          echo "======================================"
          echo "Deployment completed successfully!"
          echo "======================================"
