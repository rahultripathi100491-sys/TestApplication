name: Build and Deploy .NET API

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:

    name: Build

    runs-on: windows-latest

    steps:

      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # Setup .NET
      # ==========================================

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'


      # ==========================================
      # Find Solution
      # ==========================================

      - name: Find solution file
        shell: powershell
        run: |
          Write-Host "Repository files:"
          Get-ChildItem -Recurse -File | Select-Object FullName

          $solution = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1

          if (-not $solution) {
              Write-Error "No .sln file found!"
              exit 1
          }

          Write-Host "Solution found:"
          Write-Host $solution.FullName

          "SOLUTION_PATH=$($solution.FullName)" >> $env:GITHUB_ENV


      # ==========================================
      # Restore
      # ==========================================

      - name: Restore dependencies
        run: dotnet restore "$env:SOLUTION_PATH"


      # ==========================================
      # Build
      # ==========================================

      - name: Build solution
        run: dotnet build "$env:SOLUTION_PATH" --configuration Release --no-restore


      # ==========================================
      # Find API Project
      # ==========================================

      - name: Find API project
        shell: powershell
        run: |

          $projects = Get-ChildItem -Recurse -Filter *.csproj

          Write-Host "Projects found:"

          foreach ($project in $projects) {
              Write-Host $project.FullName
          }

          # Find project containing Microsoft.NET.Sdk.Web
          $apiProject = $null

          foreach ($project in $projects) {

              $content = Get-Content $project.FullName -Raw

              if ($content -match "Microsoft.NET.Sdk.Web") {
                  $apiProject = $project
                  break
              }
          }

          if (-not $apiProject) {
              Write-Error "ASP.NET Core Web project (.csproj) not found!"
              exit 1
          }

          Write-Host "API project found:"
          Write-Host $apiProject.FullName

          "API_PROJECT=$($apiProject.FullName)" >> $env:GITHUB_ENV


      # ==========================================
      # Publish API
      # ==========================================

      - name: Publish API
        run: |
          dotnet publish "$env:API_PROJECT" `
            --configuration Release `
            --output ./publish `
            --no-restore


      # ==========================================
      # Show Publish Files
      # ==========================================

      - name: Check publish files
        shell: powershell
        run: |
          Write-Host "Published files:"
          Get-ChildItem ./publish -Recurse


      # ==========================================
      # Deploy to Somee
      # ==========================================

      - name: Deploy to Somee
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_PATH }}


      # ==========================================
      # Success
      # ==========================================

      - name: Deployment completed
        run: |
          Write-Host "===================================="
          Write-Host "Deployment completed successfully!"
          Write-Host "===================================="
